name: Check research archive

# Confirms that the RESEARCH_KEY secret opens research/research.tar.gz.enc.
# Logs in a public repository are public, so this prints only a file count: never names or contents.
on:
  push:
    paths: ["research/research.tar.gz.enc", ".github/workflows/check-research.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decrypt in memory and count files
        env:
          RESEARCH_KEY: ${{ secrets.RESEARCH_KEY }}
        run: |
          if [ -z "$RESEARCH_KEY" ]; then
            echo "::warning::The RESEARCH_KEY secret is not set, so the archive was not checked."
            exit 0
          fi
          n=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:RESEARCH_KEY \
                -in research/research.tar.gz.enc 2>/dev/null | tar -tzf - 2>/dev/null | grep -vc '/$') \
            || { echo "::error::RESEARCH_KEY does not open research/research.tar.gz.enc."; exit 1; }
          echo "The research archive opens with RESEARCH_KEY and holds $n files."
