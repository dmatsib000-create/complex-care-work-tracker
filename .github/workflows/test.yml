# Runs the browser tests on every pull request, and on main after a merge.
# main is what GitHub Pages publishes, so a red check on a pull request means: do not merge yet.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      # Names used but never defined, or defined but never used (see eslint.config.js). Fast, so it runs first.
      - name: Lint
        run: npm run lint
      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
